a
{
text-decoration:none;

.tab {
  overflow: hidden;
  border: 1px;
  background-color:rgb(0,172,238);
}

.tab button {
  background: rgb(0,172,238);
background:black;
  float: left;
  border: none;
  outline: none;
color:white;
  cursor: pointer;
  padding: 20px 40px;
  transition: 0.3s;
  font-size: 17px;
}
 
.tab button:span {
 position: relative;
  display: block;
  width: 100%;
  height: 100%

}

.tab button:before,

.tab button:after {
  position: absolute;
  content: "";
  right: 0;
  top: 0;
   background: rgba(2,126,251,1);
  transition: all 0.3s ease;
}

.tab button:before {
  height: 0%;
  width: 2px;
}         

.tab button:after {
  width: 0%;
  height: 2px;
}

.tab button:hover{
   background: transparent;
  box-shadow: none;
}
.tab button:hover:before {
  height: 100%;
}

.tab button:hover:after {
  width: 100%;
}

.tab button span:hover{
   color: black;
}

.tab button span:before,
.tab button span:after {
  position: absolute;
  content: "";
  left: 0;
  bottom: 0;
   background: rgba(2,126,251,1);
  transition: all 0.3s ease;
}
.tab button span:before {
  width: 2px;
  height: 0%;
}
.tab button span:after {
  width: 0%;
  height: 2px;
}
.tab button span:hover:before {
  height: 100%;
}
.tab button span:hover:after {
  width: 100%;
}
           
.tabcontent {
  display: none;
  padding: 6px 12px;
  border: 1px solid #ccc;
  border-top: none;
}

.navbar {
			display: flex;
